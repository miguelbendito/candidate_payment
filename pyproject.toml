[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "run99-lib"
version = "0.1.0"
description = "Payment run processing utilities"
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "Miguel Bendito", email = "miguel.bendito02@gmail.com" }]
license = { text = "MIT" }   # or whatever you intend
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["candidate_payment*"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]